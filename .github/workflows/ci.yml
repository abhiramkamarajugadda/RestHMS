name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HospitalManagementSystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: HospitalManagementSystem/pom.xml
      - name: Build and run tests
        run: mvn -B verify
