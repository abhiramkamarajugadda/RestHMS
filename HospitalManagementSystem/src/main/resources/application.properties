spring.application.name=HospitalManagementSystem

# Default profile: MySQL. Use SPRING_PROFILES_ACTIVE=demo for in-memory H2 with sample data.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/boothms?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# Render sets PORT; local default stays 7000
server.port=${PORT:7000}
server.forward-headers-strategy=framework

# Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
