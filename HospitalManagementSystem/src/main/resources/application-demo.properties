# Demo profile: in-memory H2 seeded with sample doctors and patients.
# Data resets whenever the app restarts, so it is safe for a public live demo.
spring.datasource.url=jdbc:h2:mem:hmsdemo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.datasource.hikari.maximum-pool-size=5
